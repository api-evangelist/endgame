name: Endgame
description: 'Endgame was an endpoint security company building endpoint protection,
  threat hunting, and adversary detection technology, and was surfaced into the API
  Evangelist network as a venture-portfolio lead. It no longer operates as an independent
  company: Endgame was acquired by Elastic N.V. and its technology was folded into
  Elastic Security. As of a live probe on 2026-07-20 the endgame.com domain is retained
  as a redirect only — the site root and every /.well-known/ discovery path answer
  HTTP 301 to https://www.elastic.co/security/endpoint-security. Endgame publishes
  no developer portal, API documentation, OpenAPI description, SDKs, CLI, webhook or
  event surface, changelog, status page, or MCP server of its own. This profile is
  retained as a verified-defunct record pointing at the successor product at Elastic;
  teams evaluating the technology should integrate against Elastic Security.'
